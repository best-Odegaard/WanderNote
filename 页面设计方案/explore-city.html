<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>城市详情 - WanderNote 行笺</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-no-tab">
    <div class="navbar">
      <div class="nav-back" data-back>‹</div>
      <div class="navbar-title" id="pageTitle">肇庆 · 落羽杉季</div>
      <div class="nav-spacer"></div>
    </div>

    <div id="superSpot"></div>

    <div class="category-sections">
      <div class="category-tabs" id="categoryTabs">
        <div class="category-tab active" data-cat="food">吃</div>
        <div class="category-tab" data-cat="experience">玩</div>
        <div class="category-tab" data-cat="spot">景点</div>
      </div>
      <div id="categoryList"></div>
    </div>
  </div>

  <div style="position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-bottom));background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;z-index:100;">
    <a href="explore.html" class="btn btn-ghost" style="flex:1;">返回探索</a>
    <a href="ai-chat.html" id="planBtn" class="btn btn-primary" style="flex:2;">就这里，帮我规划</a>
  </div>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const cityId = window.getQuery('city') || 'zq';
    const city = MOCK_UTILS.getCityById(cityId);
    const spot = MOCK.superSpots[cityId];
    let currentCat = 'food';

    document.getElementById('pageTitle').textContent = `${city.name} · ${city.hotTag}`;
    document.getElementById('planBtn').href = `ai-chat.html?city=${cityId}&q=${encodeURIComponent(city.name)}`;

    document.getElementById('superSpot').innerHTML = `
      <div class="super-spot" style="margin-top:12px;">
        <div class="super-spot-img" style="display:flex;align-items:center;justify-content:center;font-size:80px;">${spot.emoji}</div>
        <div class="super-spot-info">
          <div style="display:flex;gap:8px;margin-bottom:6px;">
            <span class="tag tag-hot">${city.hotTag}</span>
          </div>
          <div class="super-spot-name">${spot.name}</div>
          <div class="super-spot-reason">${spot.reason}</div>
        </div>
      </div>
    `;

    function renderCategory() {
      document.querySelectorAll('.category-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === currentCat);
      });
      const contents = MOCK_UTILS.getCityContents(cityId)[currentCat];
      const catNames = { food: '吃 · 当地特色小吃与必买特产', experience: '玩 · 当地特有项目', spot: '景点 · 特殊场景' };
      document.getElementById('categoryList').innerHTML = `
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">${catNames[currentCat]}</div>
        ${contents.map(item => `
          <div class="spot-card">
            <div class="spot-card-img">${item.emoji}</div>
            <div class="spot-card-body">
              <div class="spot-card-title">${item.name}</div>
              <div class="spot-card-reason">${item.reason}</div>
            </div>
            <button class="btn btn-outline btn-sm" style="align-self:center;" onclick="openAddConfirm('${item.name}', '${cityId}')">加入行程</button>
          </div>
        `).join('')}
      `;
    }

    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentCat = tab.dataset.cat;
        renderCategory();
      });
    });

    renderCategory();
  </script>
</body>
</html>
