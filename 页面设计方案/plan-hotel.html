<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>选择住宿 - WanderNote 行笺</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-no-tab">
    <div class="navbar">
      <div class="nav-back" data-back>‹</div>
      <div class="navbar-title">选择住宿</div>
      <div class="nav-spacer"></div>
    </div>

    <div class="route-header">
      <div class="route-title">肇庆 · 2 晚</div>
      <div class="route-sub">12-20 入住 · 12-22 离店</div>
    </div>

    <div class="hotel-filters">
      <span class="chip selected">亲子友好</span>
      <span class="chip">有泳池</span>
      <span class="chip">近景区</span>
      <span class="chip">温泉</span>
      <span class="chip">性价比高</span>
    </div>

    <div id="hotelList"></div>

    <div style="padding:16px;color:var(--text-secondary);font-size:12px;text-align:center;">
      价格为参考价，实际以携程为准。点击「携程预订」跳转查询。
    </div>
  </div>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const cityId = 'zq';
    const hotels = MOCK_UTILS.getHotels(cityId);

    document.getElementById('hotelList').innerHTML = hotels.map(h => `
      <div class="hotel-card">
        <div class="hotel-img">${h.emoji}</div>
        <div class="hotel-body">
          <div>
            <div class="hotel-name">${h.name}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${h.dist}</div>
          </div>
          <div class="hotel-tags">
            ${h.tags.map(t => `<span class="tag tag-brand">${t}</span>`).join('')}
          </div>
          <div class="hotel-price">
            <strong>¥${h.price}</strong> / 晚 · 参考价
          </div>
          <div class="hotel-actions">
            <a href="https://m.ctrip.com/html5/hotel/hoteldetail/${h.name}" target="_blank" class="btn btn-outline btn-sm" style="flex:1;">携程预订 →</a>
            <a href="trip-detail.html" class="btn btn-primary btn-sm" style="flex:1;">确认这家</a>
          </div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.hotel-filters .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('selected');
      });
    });
  </script>
</body>
</html>
