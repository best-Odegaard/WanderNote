<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>智能导入 - WanderNote 行笺</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-no-tab">
    <div class="navbar">
      <div class="nav-back" data-back>‹</div>
      <div class="navbar-title">智能导入</div>
      <div class="nav-spacer"></div>
    </div>

    <div style="padding:20px 16px;">
      <div class="card card-pad" style="margin-bottom:16px;">
        <div style="font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:8px;">🔗 粘贴游记链接</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">支持小红书、马蜂窝、公众号文章链接，自动识别地点。</div>
        <div class="input-inner" style="background:var(--bg-input);border-radius:12px;">
          <input type="text" placeholder="https://..." style="flex:1;">
        </div>
      </div>

      <div class="card card-pad" style="margin-bottom:16px;">
        <div style="font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:8px;">📷 上传截图</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">上传攻略截图，OCR 识别景点并生成行程草稿。</div>
        <div style="border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;color:var(--text-tertiary);">
          <div style="font-size:32px;margin-bottom:8px;">📤</div>
          <div>点击上传截图</div>
        </div>
      </div>

      <a href="ai-chat.html" class="btn btn-primary btn-block" style="margin-top:8px;" onclick="startImport(event)">开始识别并规划</a>
    </div>
  </div>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function startImport(e) {
      e.preventDefault();
      window.clearSlots();
      window.clearMustList();
      window.setSlot('destination', '肇庆');
      alert('已识别出 5 个地点：七星岩、鼎湖山、岩前村、仙女湖、端砚村');
      window.location.href = 'ai-chat.html?q=识别到肇庆5个地点';
    }
  </script>
</body>
</html>
