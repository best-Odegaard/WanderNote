<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WanderNote 行笺 - 对话即行程</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page">
    <div class="hero-input-wrap">
      <form class="hero-input" onsubmit="startChat(event)">
        <input type="text" id="heroInput" placeholder="例如：肇庆 2 天，亲子，想看落羽杉" autocomplete="off">
        <button type="submit" class="send-btn">➤</button>
      </form>
    </div>

    <div class="quick-trips">
      <div class="section-header">
        <span class="section-title">灵感推荐</span>
        <a href="explore.html" class="section-more">探索 ›</a>
      </div>
      <a href="explore-city.html?city=zq" class="card" style="display:flex; margin:0 16px 16px; overflow:hidden;">
        <div style="width:100px;height:100px;background:linear-gradient(135deg,#a7f3d0,#5eead4);display:flex;align-items:center;justify-content:center;font-size:48px;">🏞️</div>
        <div style="flex:1;padding:14px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:4px;">肇庆 · 落羽杉季</div>
          <div style="font-size:13px;color:var(--text-secondary);">全国最大溶洞群，冬季恒温 20℃</div>
        </div>
      </a>
    </div>

    <div class="quick-trips">
      <div class="section-header">
        <span class="section-title">最近行程</span>
        <a href="trip-index.html" class="section-more">全部 ›</a>
      </div>
      <a href="trip-detail.html" class="list-item">
        <div class="list-thumb">🌲</div>
        <div class="list-body">
          <div class="list-title">肇庆 2 日亲子游</div>
          <div class="list-meta">12-20 出发 · 6 个景点 · 已保存</div>
        </div>
      </a>
      <a href="trip-detail.html" class="list-item">
        <div class="list-thumb">🌉</div>
        <div class="list-body">
          <div class="list-title">重庆 3 天 2 夜</div>
          <div class="list-meta">规划中 · 火锅 · 夜景 · 轻轨穿楼</div>
        </div>
      </a>
    </div>
  </div>

  <a href="ai-chat.html" class="fab" title="问小笺">💬</a>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    window.mountTabBar(0);

    function startChat(e) {
      e.preventDefault();
      const text = document.getElementById('heroInput').value.trim();
      window.clearSlots();
      window.clearMustList();
      if (text) {
        window.setSlot('destination', text.split(' ')[0]);
        window.location.href = 'ai-chat.html?q=' + encodeURIComponent(text);
      } else {
        window.location.href = 'ai-chat.html';
      }
    }
  </script>
</body>
</html>
