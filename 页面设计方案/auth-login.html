<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 - WanderNote 行笺</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">
      <div class="auth-logo-icon">🗺️</div>
      <div class="auth-logo-title">WanderNote 行笺</div>
      <div style="font-size:14px;color:var(--text-secondary);margin-top:8px;">登录后保存行程、收藏游记</div>
    </div>

    <form onsubmit="login(event)">
      <div class="form-group">
        <label class="form-label">手机号</label>
        <input type="tel" class="form-input" placeholder="请输入手机号" value="13800138000">
      </div>
      <div class="form-group">
        <label class="form-label">验证码</label>
        <div style="display:flex;gap:10px;">
          <input type="text" class="form-input" placeholder="请输入验证码" style="flex:1;" value="123456">
          <button type="button" class="btn btn-outline" style="white-space:nowrap;">获取验证码</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;height:50px;font-size:16px;">登录</button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary);">
      未注册手机号验证后将自动创建账号
    </div>
  </div>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function login(e) {
      e.preventDefault();
      window.location.href = 'profile.html';
    }
  </script>
</body>
</html>
