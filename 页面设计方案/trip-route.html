<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>完整路线 - WanderNote 行笺</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-no-tab">
    <div class="navbar">
      <div class="nav-back" data-back>‹</div>
      <div class="navbar-title">完整路线</div>
      <div class="nav-spacer"></div>
    </div>

    <div class="route-header">
      <div class="route-title">肇庆 2 日 · Day 1</div>
      <div class="route-sub">酒店出发 → 各景点 → 返回酒店 · 全程闭环</div>
    </div>

    <div id="segments"></div>

    <div style="padding:16px;color:var(--text-secondary);font-size:12px;text-align:center;">
      受地图 URI 能力限制，全天路线在应用内自绘；导航按段唤起外部地图。
    </div>
  </div>

  <div class="modal-mask" id="mapModal">
    <div class="modal-panel">
      <div class="modal-title">选择导航地图</div>
      <div class="map-options">
        <div class="map-option" onclick="chooseMap('amap')">高德地图</div>
        <div class="map-option" onclick="chooseMap('baidu')">百度地图</div>
        <div class="map-option" onclick="chooseMap('tencent')">腾讯地图</div>
      </div>
      <button class="btn btn-ghost btn-block" onclick="closeMapModal()">取消</button>
    </div>
  </div>

  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const trip = MOCK_UTILS.getSampleTrip();
    const day = trip.dayPlans[0].schedules;
    const segments = [];
    for (let i = 0; i < day.length - 1; i++) {
      segments.push({ from: day[i], to: day[i + 1], seq: i + 1 });
    }

    document.getElementById('segments').innerHTML = segments.map(seg => `
      <div class="segment-card">
        <div class="segment-header">
          <span class="segment-index">第 ${seg.seq}/${segments.length} 段</span>
          <span class="tag tag-brand">${seg.to.type === 'hotel' ? '返回酒店' : '下一站'}</span>
        </div>
        <div class="segment-places">
          <div class="segment-place">
            <div class="segment-place-name">${seg.from.emoji}</div>
            <div class="segment-place-type">${seg.from.title}</div>
          </div>
          <div class="segment-arrow">→</div>
          <div class="segment-place">
            <div class="segment-place-name">${seg.to.emoji}</div>
            <div class="segment-place-type">${seg.to.title}</div>
          </div>
        </div>
        <div class="segment-info">
          <span>🚗 约 ${15 + seg.seq * 5} 分钟</span>
          <span>📏 约 ${2 + seg.seq} km</span>
        </div>
        <div class="segment-actions">
          <button class="btn btn-ghost btn-sm" ${seg.seq === 1 ? 'disabled style="opacity:0.5;"' : ''}>上一段</button>
          <button class="btn btn-primary" onclick="openMapModal()">🧭 导航这段</button>
          <button class="btn btn-ghost btn-sm">下一段</button>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
