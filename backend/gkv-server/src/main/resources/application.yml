server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      # 图片上传大小限制（手机拍照原图常见 3~15MB）
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gkv.entity
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gkv.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      gkv:
        mapper: debug
        service: info
        controller: info

# Python AI Agent 服务地址（本地开发走内网回环；生产按部署说明改公网地址）
agent:
  chat-url: http://127.0.0.1:8002/api/chat
  plan-url: http://127.0.0.1:8002/api/plan

# 用户画像摘要模型（独立 provider，与对话/规划用的模型完全分开）
#
# 走 OpenAI 兼容的 /chat/completions，任何兼容厂商只改这三个配置项，不用动代码。
# url 要填到 /chat/completions 为止（不是 base_url）。
#
# 降级行为：三项任一为空 → 摘要重写直接跳过并打 warn 日志，
#          对话、生成行程、标签权重累加全部照常，只是没有 AI 文字摘要。
# 生产建议用环境变量注入，避免把 key 提交进仓库。
profile:
  summary:
    url: ${PROFILE_SUMMARY_URL:}
    api-key: ${PROFILE_SUMMARY_API_KEY:}
    model: ${PROFILE_SUMMARY_MODEL:}

# 携程酒店深链（构造逻辑唯一出口：com.gkv.utils.CtripUrlBuilder）
#
# 为什么放配置而不是写死在代码里：
#   携程没有公开 API，跳转靠 H5/App 深链，参数名会随携程前端改版而变。
#   放在这里，改版时只动这一行、重启即可，不用改代码重新打包。
#
# ★ 参数模板以携程官方 URL 生成工具产出的结果为准 ★
#   http://pages.ctrip.com/commerce/promote/common/tools/converturl/index.html
#   下面的值是按携程 H5 酒店列表页公开参数拼的可用近似，上线前请真机验证一次。
#
# 占位符：{city} {checkin} {checkout} {keyword} {name} {landmark}
#   keyword = 酒店名 + 附近地标（用户要求「地点和酒店名一起搜」）
# 留空则用 CtripUrlBuilder 内置的同名默认模板（行为一致，只是少一处可配点）。
ctrip:
  hotel:
    url-template: ${CTRIP_HOTEL_URL_TEMPLATE:https://m.ctrip.com/webapp/hotel/hotellist?cityName={city}&checkin={checkin}&checkout={checkout}&keyword={keyword}}

# 订票深链（构造逻辑唯一出口：com.gkv.utils.TicketUrlBuilder）
#
# 为什么也放配置：12306 与携程都没有公开 API，跳转靠 H5 深链，参数名随它们前端改版而变。
#   放这里，改版时只动这两行、重启即可，不用改代码重新打包。
#
# ★ 下面两行都不是官方承诺的参数格式 ★
#   12306：linktypeid=dc 是单程查询页，flag=N,N,Y 是默认勾选位。
#   携程：H5 机票搜索页的公开参数。
#   上线前请真机各跑一次，把核对后的模板写在这里（会覆盖代码里的内置默认）。
#
# 占位符：{from} {to}（站名/机场，没有则退化为城市名）{fromCity} {toCity} {date} {no}
# 留空则用 TicketUrlBuilder 内置的同名默认模板（行为一致，只是少一处可配点）。
ticket:
  train:
    url-template: ${TICKET_TRAIN_URL_TEMPLATE:https://kyfw.12306.cn/otn/leftTicket/init?linktypeid=dc&fs={from}&ts={to}&date={date}&flag=N,N,Y}
  flight:
    url-template: ${TICKET_FLIGHT_URL_TEMPLATE:https://m.ctrip.com/webapp/flight/search?dcity={fromCity}&acity={toCity}&ddate={date}}

sky:
  # 用户历史画像是否回灌给大模型。
  # false（默认）= 停用：对话里不会带上用户过往偏好，前端也不再展示「记住的偏好」开关。
  # 注意：画像数据仍在正常沉淀，「记住的偏好」只是不再生效；改回 true 即可恢复。
  profile:
    inject-enabled: ${PROFILE_INJECT_ENABLED:false}

  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 720000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 设置jwt签名加密时使用的密钥
    user-secret-key: itheima
    # 设置过期时间
    user-ttl: 720000000
    # 设置前端传递过来的名称
    user-token-name: Authentication

  #配置阿里云对象存储配置  为了减少在此配置文件修改，用引用的方法来配置信息
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss-key-secret}
    bucket-name: ${sky.alioss.bucket-name}



