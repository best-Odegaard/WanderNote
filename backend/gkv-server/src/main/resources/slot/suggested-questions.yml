# 「猜你想问」规则
#
# 目的：每一轮对话之后给用户 2-3 个可以点的追问，点一下就成为下一轮输入。
# 用户刚聊完往往"还想问点什么但说不出来"，让他对着空白输入框硬想是流失点。
#
# 与 question-tree.yml 的分工：
#   question-tree.yml 收集**参数**（去哪、几天、预算…）
#   本文件提供**内容话题**（那地方有什么好吃、怎么去方便、带娃怎么排…）
# 两者互补：参数类问题由槽位引擎负责且每轮只问一个；话题类问题每轮给几个选项。
#
# 字段：
#   id             规则标识（仅用于日志与排查）
#   whenCity       目的地等于该城市时命中
#   whenMissing    列出的槽位都还没值时命中
#   whenSlotEquals 指定槽位等于指定值时命中
#   whenSlotIn     指定槽位取值落在给定集合内时命中
#   whenRoundAtLeast  已提问轮次 >= N 时命中
#   questions      候选问题（会与已给出的去重、并避开当前待回答的槽位问题）
#
# 规则按顺序命中，累计到 maxItems 为止，所以**顺序就是优先级**。

# 每轮给几条（用户口径是"三个"）。
# minItems 是下限，仅用于日志提示；候选不足时不硬凑。
maxItems: 3
minItems: 2

# 每条规则最多贡献几条。
#
# ⚠️ 这个值必须是 1，否则会踩一个很隐蔽的坑：
# 初版把 maxPerRule 当成无限，结果 missing_days 一条规则就占满 3 个名额，
# 用户看到的全是"玩几天"的三种说法，城市/同行人这些**更具体**的建议永远轮不到。
# 限制成 1 之后，3 个名额会由 3 条不同规则贡献，话题自然分散。
maxPerRule: 1

# 规则按顺序命中，累计到 maxItems 为止 —— **顺序就是优先级**。
# 排序原则：越"具体到这次出行"的越靠前，泛泛的兜底越靠后。
# 因为用户已经说了目的地/同行人时，最有用的是当地和人群相关的话题，
# 而不是"要去几天"这类他本来就该答的参数问题。
rules:
  # —— 第一优先：知道去哪了，就给当地的具体话题 ——
  - id: city_zhaoqing
    whenCity: 肇庆
    questions:
      - "七星岩要留多久？"
      - "肇庆有什么必吃？"
      - "住七星岩附近好吗？"
      - "星湖晚上值得去吗？"

  - id: city_chongqing
    whenCity: 重庆
    questions:
      - "洪崖洞几点去不挤？"
      - "重庆小面哪家好？"
      - "两天能玩哪些地方？"
      - "住解放碑还是观音桥？"

  - id: city_guangzhou
    whenCity: 广州
    questions:
      - "广州塔要提前买票吗？"
      - "早茶去哪家不踩雷？"
      - "老城区怎么逛最舒服？"

  - id: city_chengdu
    whenCity: 成都
    questions:
      - "看熊猫几点去最好？"
      - "成都小吃去哪条街？"
      - "周边一日游去哪合适？"

  - id: city_guilin
    whenCity: 桂林
    questions:
      - "漓江游船要提前订吗？"
      - "阳朔住哪一段好？"
      - "几月去山水最好看？"

  - id: city_hangzhou
    whenCity: 杭州
    questions:
      - "西湖怎么逛不走回头路？"
      - "龙井村值得去吗？"
      - "杭州有什么必吃？"

  # —— 通用城市规则：任何已知道目的地的城市都能命中，问题里用 {city} 占位 ——
  #
  # 为什么要有这条：上面那些城市规则是手写的，只能覆盖几个城市；
  # 用户说"我想去深圳"而深圳没被手写覆盖时，猜你想问就跟目的地毫无关系，
  # 看起来像"AI 没听我说话"。有了 {city} 占位符，任何城市都能得到强相关问题，
  # 而且以后新增城市不用再改配置。
  - id: city_generic
    whenDestinationKnown: true
    questions:
      - "{city}有什么必吃？"
      - "{city}住哪个区域方便？"
      - "{city}两天够玩吗？"
      - "{city}有什么适合晚上去的？"

  # —— 第二优先：同行人决定了很多安排，话题也最贴 ——
  - id: with_family
    whenSlotEquals:
      companion: family
    questions:
      - "带娃适合住哪？"
      - "亲子路线怎么排轻松？"
      - "孩子累了怎么调整？"

  # —— 第三优先：预算敏感 ——
  - id: budget_sensitive
    whenSlotIn:
      budget: [ "500" ]
    questions:
      - "预算 500 能住哪？"
      - "有免费景点吗？"
      - "怎么坐车最省？"

  # —— 第四优先：参数还缺什么，给"这类问题怎么定"的话题 ——
  - id: missing_days
    whenMissing: [ days ]
    questions:
      - "两天怎么排不累？"
      - "周末去够吗？"
      - "玩几天比较合适？"

  - id: missing_depart_city
    whenMissing: [ departCity ]
    questions:
      - "怎么去比较方便？"
      - "高铁到哪个站？"
      - "自驾方便吗？"

  # —— 第五优先：聊了几轮之后，把话题往"定稿"上引 ——
  - id: round_ge_3
    whenRoundAtLeast: 3
    questions:
      - "第一天到了先玩什么？"
      - "能换成 3 天吗？"
      - "行程会不会太赶？"

  # —— 兜底：任何阶段都成立的话题，保证任何时候都有东西可点 ——
  # 刻意拆成 4 条规则而不是 1 条带 4 个问题的规则：
  # maxPerRule=1 时一条规则只能出 1 条，兜底若只有一条规则，用户就会只看到 1 个候选。
  - id: generic_avoid
    questions:
      - "帮我避开人多的地方"
      - "有没有小众一点的地方？"

  - id: generic_food
    questions:
      - "当地有什么必吃？"
      - "有什么适合带走的特产？"

  - id: generic_season
    questions:
      - "这个季节适合玩什么？"
      - "最近天气怎么样，要带什么？"

  - id: generic_tips
    questions:
      - "有什么要注意的坑？"
      - "那边交通方便吗？"
