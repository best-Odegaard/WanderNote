# ============================================================
# geek012 管理后台 nginx 配置（独立端口 8082）
# 作用：
#   1. 托管管理前端静态文件（/www/geek012/admin_h5，SPA 回退）
#   2. 将 /admin/** API 反代到后端 jar（127.0.0.1:8081）
# 部署方式：复制到 /etc/nginx/conf.d/admin-8082.conf 后 nginx -s reload
# ============================================================
server {
    listen 8082;
    server_name _;

    root /www/geek012/admin_h5;
    index index.html;

    # 静态资源 + SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端 API 反代（保持原 URI 转发给后端）
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
